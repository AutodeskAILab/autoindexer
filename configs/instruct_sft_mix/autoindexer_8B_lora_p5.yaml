# @package _global_

defaults:
  - autoindexer_8B
  - _self_

model:
  lora:
    r: 16
    lora_alpha: 64
    lora_dropout: 0.05
    target_modules: all-linear
    modules_to_save:
      - index_head
      - marker_head
      - edit_embedding
    bias: none

trainer:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
